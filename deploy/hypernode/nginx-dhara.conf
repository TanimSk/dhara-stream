# /etc/nginx/sites-available/dhara.2devs.net — certbot --nginx adds the TLS blocks.

limit_req_zone $binary_remote_addr zone=dhara_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dhara_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=dhara_play:20m rate=30r/s;

upstream dhara_app {
    server 127.0.0.1:8830 fail_timeout=0;
    keepalive 8;
}

# ---------- dashboard + API ----------
server {
    listen 80;
    listen [::]:80;
    server_name dhara.2devs.net;

    access_log /var/log/nginx/dhara.2devs.net.access.log;
    error_log  /var/log/nginx/dhara.2devs.net.error.log;

    root /srv/dhara/web;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 8m;   # JSON only; video goes straight to R2

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/v1/auth/ {
        limit_req zone=dhara_auth burst=10 nodelay;
        include /etc/nginx/dhara_proxy.conf;
    }
    location /api/ {
        limit_req zone=dhara_api burst=40 nodelay;
        include /etc/nginx/dhara_proxy.conf;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /ffmpeg/ { expires 30d; }
    location / { try_files $uri /index.html; }
}

# ---------- player + playback gate ----------
server {
    listen 80;
    listen [::]:80;
    server_name dhara-play.2devs.net;

    access_log /var/log/nginx/dhara-play.2devs.net.access.log;
    error_log  /var/log/nginx/dhara-play.2devs.net.error.log;

    client_max_body_size 1k;

    location /embed/ { limit_req zone=dhara_play burst=20 nodelay; include /etc/nginx/dhara_proxy.conf; }
    location /v/     { limit_req zone=dhara_play burst=60 nodelay; include /etc/nginx/dhara_proxy.conf; }
    location /static/ { alias /srv/dhara/static/; expires 30d; gzip on; gzip_types application/javascript; }
    location = /health { include /etc/nginx/dhara_proxy.conf; }
    location / { return 404; }
}
