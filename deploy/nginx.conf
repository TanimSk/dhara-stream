# /etc/nginx/sites-available/dhara  — replace dhara.app / play.dhara.app with your domains.
# TLS: certbot --nginx -d dhara.app -d play.dhara.app

limit_req_zone $binary_remote_addr zone=dhara_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dhara_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=dhara_play:20m rate=30r/s;

upstream dhara_app {
    server unix:/run/dhara/gunicorn.sock fail_timeout=0;
    keepalive 16;
}

# ---------- dashboard + API ----------
server {
    listen 443 ssl http2;
    server_name dhara.app;
    # ssl_certificate / ssl_certificate_key managed by certbot

    root /srv/dhara/web/dist;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Video bytes never come through here; only JSON (complete() carries playlists).
    client_max_body_size 8m;

    location /api/v1/auth/ {
        limit_req zone=dhara_auth burst=10 nodelay;
        include /etc/nginx/dhara_proxy.conf;
    }
    location /api/ {
        limit_req zone=dhara_api burst=40 nodelay;
        include /etc/nginx/dhara_proxy.conf;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /ffmpeg/ {
        # ffmpeg.wasm core for browser remux (~31 MB, fetched once per browser)
        expires 30d;
    }
    location / {
        try_files $uri /index.html;
    }
}

# ---------- player + playback gate ----------
server {
    listen 443 ssl http2;
    server_name play.dhara.app;

    client_max_body_size 1k;

    location /embed/ {
        limit_req zone=dhara_play burst=20 nodelay;
        include /etc/nginx/dhara_proxy.conf;
    }
    location /v/ {
        limit_req zone=dhara_play burst=60 nodelay;
        include /etc/nginx/dhara_proxy.conf;
    }
    location /static/ {
        alias /srv/dhara/backend/staticfiles/;
        expires 30d;
        gzip on;
        gzip_types application/javascript;
    }
    location = /health { include /etc/nginx/dhara_proxy.conf; }
    location / { return 404; }
}

server {
    listen 80;
    server_name dhara.app play.dhara.app;
    return 301 https://$host$request_uri;
}
