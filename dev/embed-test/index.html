<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dhara embed test</title>
  <style>
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #1d1d1f; }
    .frame { position: relative; padding-top: 56.25%; border-radius: 16px; overflow: hidden; background: #000; }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    input { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    code { background: #f1f1ed; padding: 2px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Embed test page</h1>
  <p>This page plays the role of a client's website (<code>localhost:5500</code>, an allowed domain for the demo client).
     Paste an embed URL from the dashboard below.</p>
  <input id="src" placeholder="http://localhost:8000/embed/<video-id>?token=…&exp=…">
  <p></p>
  <div class="frame"><iframe id="f" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe></div>
  <script>
    const input = document.getElementById("src"), f = document.getElementById("f");
    const go = () => { if (input.value) { f.src = input.value; history.replaceState(null, "", "?src=" + encodeURIComponent(input.value)); } };
    input.addEventListener("change", go);
    const p = new URLSearchParams(location.search).get("src");
    if (p) { input.value = p; go(); }
  </script>
</body>
</html>
